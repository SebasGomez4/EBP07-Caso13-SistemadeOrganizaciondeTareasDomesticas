name: CI/CD Pipeline - Soyla

# ============================================================================
# TRIGGERS: Define cuándo se ejecuta este workflow
# ============================================================================
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Permite ejecución manual desde GitHub

# ============================================================================
# CONFIGURACIÓN GLOBAL
# ============================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

# ============================================================================
# JOBS: Etapas del pipeline
# ============================================================================
jobs:
  # =========================================================================
  # JOB 1: VALIDACIÓN DEL BACKEND (JAVA/MAVEN)
  # =========================================================================
  backend-validation:
    name: 🔧 Backend Validation (Java/Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- Setup del entorno ---
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # --- Validaciones ---
      - name: 🔍 Validar estructura del proyecto
        run: |
          if [ ! -f "Soyla/pom.xml" ]; then
            echo "❌ Error: pom.xml no encontrado"
            exit 1
          fi
          echo "✅ Estructura del proyecto validada"

      - name: 🧪 Ejecutar pruebas unitarias
        run: |
          cd Soyla
          mvn test --batch-mode --fail-fast -DskipITs

      - name: 🏗️ Compilar y construir backend
        run: |
          cd Soyla
          mvn clean package -DskipTests --batch-mode

      - name: 📊 Generar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-reports
          path: Soyla/target/surefire-reports/
          retention-days: 7

  # =========================================================================
  # JOB 2: VALIDACIÓN DEL FRONTEND (REACT/VITE)
  # =========================================================================
  frontend-validation:
    name: 🎨 Frontend Validation (React/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- Setup del entorno ---
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'Soyla/Frontend/package-lock.json'

      # --- Validaciones ---
      - name: 🔍 Validar estructura del frontend
        run: |
          if [ ! -f "Soyla/Frontend/package.json" ]; then
            echo "❌ Error: package.json no encontrado"
            exit 1
          fi
          echo "✅ Estructura del frontend validada"

      - name: 📥 Instalar dependencias
        working-directory: Soyla/Frontend
        run: npm ci

      - name: 🔎 Ejecutar linting (si está configurado)
        working-directory: Soyla/Frontend
        continue-on-error: true
        run: npm run lint || echo "⚠️ Linting no configurado"

      - name: 🏗️ Construir frontend
        working-directory: Soyla/Frontend
        run: npm run build

      - name: 📤 Guardar artefactos del build
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: Soyla/Frontend/dist/
          retention-days: 7

  # =========================================================================
  # JOB 3: ANÁLISIS DE SEGURIDAD Y CALIDAD
  # =========================================================================
  security-analysis:
    name: 🔐 Security & Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔒 Verificar dependencias vulnerables (Backend)
        working-directory: Soyla
        continue-on-error: true
        run: |
          mvn dependency-check:check || echo "⚠️ Vulnerabilidades encontradas (revisar reporte)"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'Soyla/Frontend/package-lock.json'

      - name: 🔒 Auditar dependencias (Frontend)
        working-directory: Soyla/Frontend
        continue-on-error: true
        run: npm audit --production

  # =========================================================================
  # JOB 4: CONSTRUCCIÓN DE IMAGEN DOCKER
  # =========================================================================
  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-validation, frontend-validation]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extraer metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build y push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Soyla/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 5: DESPLIEGUE A RENDER (Opcional - solo en main)
  # =========================================================================
  deploy-render:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://soyla-api.onrender.com

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔔 Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK no configurado. Deploy omitido."
            exit 0
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash

      - name: ✅ Deploy completado
        run: echo "🎉 Despliegue a Render iniciado. Verifica el estado en https://dashboard.render.com"

  # =========================================================================
  # JOB 6: NOTIFICACIÓN DE ESTADO FINAL
  # =========================================================================
  notify-status:
    name: 📢 Notify Build Status
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-validation, frontend-validation, security-analysis, build-docker]

    steps:
      - name: 🎯 Determinar estado
        id: status
        run: |
          if [ "${{ needs.backend-validation.result }}" == "failure" ] || \
             [ "${{ needs.frontend-validation.result }}" == "failure" ] || \
             [ "${{ needs.build-docker.result }}" == "failure" ]; then
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Resumen del Pipeline
        run: |
          echo "
          ╔════════════════════════════════════════╗
          ║   CI/CD Pipeline - Soyla               ║
          ╚════════════════════════════════════════╝
          
          📊 Estado General: ${{ steps.status.outputs.status }}
          
          📋 Resumen de Jobs:
            ✓ Backend Validation: ${{ needs.backend-validation.result }}
            ✓ Frontend Validation: ${{ needs.frontend-validation.result }}
            ✓ Security Analysis: ${{ needs.security-analysis.result }}
            ✓ Docker Build: ${{ needs.build-docker.result }}
          
          🔗 Más información: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "

# ============================================================================
# CONFIGURACIÓN ADICIONAL
# ============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
