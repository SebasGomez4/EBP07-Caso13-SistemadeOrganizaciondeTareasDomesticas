services:
  - type: web
    name: soyla-api
    runtime: docker
    branch: Front
    plan: starter
    rootDir: Soyla
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,https://soyla.vercel.app
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/app/data/soyla-db;DB_CLOSE_ON_EXIT=FALSE
    disk:
      name: soyla-data
      mountPath: /app/data
      sizeGB: 1
