databases:
  - name: soyla-db
    plan: free
    region: virginia

services:
  - type: web
    name: soyla-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: Soyla
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,https://soyla.vercel.app
      - key: APP_JWT_SECRET
        value: soyla-jwt-secret-key-change-in-production-12345678
      - key: APP_JWT_EXPIRATION_SECONDS
        value: "3600"
      - key: DATABASE_URL
        fromDatabase:
          name: soyla-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: soyla-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: soyla-db
          property: password
